    <style>
        body {
            background-color: #fff0f5; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #333;
        }
        .container {
            background-color: white;
            padding: 30px 20px;
            border-radius: 25px;
            box-shadow: 0 15px 30px rgba(255, 182, 193, 0.4);
            text-align: center;
            /* Permet au cadre de s'élargir automatiquement pour les mots longs sur PC */
            width: fit-content;
            min-width: min(400px, 90vw);
            max-width: 95vw;
            border: 2px solid #ffe4e1;
            position: relative;
            box-sizing: border-box;
        }
        
        .avatar-img {
            width: 150px; 
            height: auto;
            margin-bottom: 10px;
            transition: all 0.3s ease;
        }
        
        .flotte { animation: float 3s ease-in-out infinite; }
        .saute { animation: jump 0.5s ease infinite; }
        .tremble { animation: shake 0.5s ease; }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }
        @keyframes jump {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px) scale(1.05); }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
        }

        h1 {
            color: #ff7f50; 
            font-size: 24px;
            margin-bottom: 5px;
        }
        p.consigne {
            color: #888;
            font-size: 14px;
            margin-bottom: 20px;
            font-style: italic;
        }
        
        .reponse-zone {
            display: flex;
            justify-content: center;
            flex-wrap: nowrap; /* Empêche le retour à la ligne */
            gap: clamp(2px, 1vw, 8px); /* Espace adaptatif */
            margin: 20px 0;
            min-height: 50px;
            width: 100%;
            box-sizing: border-box;
        }
        .reponse-tuile {
            flex: 0 1 auto; /* Se compresse si besoin, mais ne s'étire pas à l'infini */
            width: clamp(25px, 8vw, 45px); /* Largeur adaptative */
            aspect-ratio: 1 / 1; /* Garde la forme carrée */
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(14px, 5vw, 24px); /* Police adaptative */
            font-weight: bold;
            color: #2c3e50;
            border-bottom: 3px solid #ffb6c1;
            text-transform: uppercase;
            transition: all 0.2s ease;
            box-sizing: border-box;
        }
        
        .reponse-tuile.indice-verrouille {
            color: #3498db; 
            border-bottom-color: #3498db;
            background-color: #f0f8ff; 
            border-radius: 8px;
        }

        .bazar-zone {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin: 20px 0;
            padding: 15px;
            background-color: #f0f8ff;
            border-radius: 15px;
            border: 2px dashed #b0c4de;
            min-height: 60px;
        }
        .lettre-btn {
            width: 45px;
            height: 45px;
            background-color: #ff7f50;
            color: white;
            font-size: 22px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 0 #e0663c;
            transition: 0.1s;
            user-select: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .lettre-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #e0663c;
        }
        .lettre-btn.utilisee {
            opacity: 0.25;
            pointer-events: none;
            box-shadow: none;
            transform: translateY(4px);
        }

        .actions-zone {
            display: flex;
            justify-content: center;
            flex-wrap: wrap; 
            gap: 10px;
            margin-top: 20px;
        }
        .btn-action {
            padding: 10px 15px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            border: none;
            transition: 0.3s;
            color: white;
        }
        
        .btn-indice {
            background-color: #f1c40f; 
            box-shadow: 0 4px 0 #f39c12;
            color: #333;
        }
        .btn-indice:hover { background-color: #f39c12; color: white; }
        .btn-indice:active { transform: translateY(4px); box-shadow: none; }

        .btn-effacer {
            background-color: #95a5a6;
            box-shadow: 0 4px 0 #7f8c8d;
        }
        .btn-effacer:hover { background-color: #7f8c8d; }
        .btn-effacer:active { transform: translateY(4px); box-shadow: none; }
        
        .btn-valider {
            background-color: #2ecc71;
            box-shadow: 0 4px 0 #27ae60;
        }
        .btn-valider:hover { background-color: #27ae60; }
        .btn-valider:active { transform: translateY(4px); box-shadow: none; }

        .message {
            margin-top: 20px;
            font-weight: bold;
            font-size: 16px;
            min-height: 24px;
        }
        .success { color: #2ecc71; }
        .error { color: #e74c3c; }

        /* --- DESIGN DE LA FENÊTRE MODALE SUR MESURE --- */
        .modal-overlay {
            display: none; /* Cachée par défaut */
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.4);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(3px); /* Joli effet de flou en arrière-plan */
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-content {
            background-color: white;
            padding: 30px 25px;
            border-radius: 25px;
            box-shadow: 0 15px 30px rgba(255, 182, 193, 0.6);
            text-align: center;
            max-width: 320px;
            width: 85%;
            border: 2px solid #ffe4e1;
            animation: popIn 0.3s ease-out;
        }
        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .modal-content h2 {
            color: #ff7f50;
            margin-top: 0;
            font-size: 22px;
            margin-bottom: 15px;
        }
        .modal-content p {
            color: #555;
            font-size: 15px;
            margin-bottom: 25px;
            line-height: 1.4;
        }
        .modal-actions {
            display: flex;
            justify-content: center;
            gap: 15px;
        }
    
        .btn-preuve {
            background-color: #9b59b6; /* Améthyste / Violet */
            box-shadow: 0 4px 0 #8e44ad;
            display: none; 
            margin-top: 15px;
            width: 100%;
        }
        .btn-preuve:hover { background-color: #8e44ad; color: white; }
        .btn-preuve:active { transform: translateY(4px); box-shadow: none; }
    </style>

    <div class="container">
        <!-- L'image de Zuzu qui changera selon les actions -->
        <img id="zuzu-avatar" src="" alt="Avatar de Zuzu" class="avatar-img flotte">
        
        <h1>Les pitits devoirs de Zuzu</h1>
        <p class="consigne">Touche les lettres pour reconstruire le mot !</p>
        
        <div class="reponse-zone" id="zone-reponse"></div>
        <div class="bazar-zone" id="zone-bazar"></div>
        
        <div class="actions-zone">
            <!-- Le nouveau bouton INDICE -->
            <button class="btn-action btn-indice" onclick="ouvrirModalIndice()">💡 Indice</button>
            <button class="btn-action btn-effacer" onclick="effacerDerniereLettre()">⌫ Effacer</button>
            <button class="btn-action btn-valider" onclick="verifier()">Valider ✔</button>
        </div>
        
        <div class="message" id="message"></div>
        <button id="btn-preuve" class="btn-action btn-preuve" onclick="copierPreuve()">📸 Partager / Copier la Preuve</button>
    </div>

    <!-- FENÊTRE MODALE INTÉGRÉE -->
    <div id="modal-indice" class="modal-overlay">
        <div class="modal-content">
            <h2>Besoin d'aide ?</h2>
            <p>Veux-tu vraiment un indice ?<br>Cela va effacer ton mot en cours et bloquer la prochaine bonne lettre !</p>
            <div class="modal-actions">
                <button class="btn-action btn-effacer" onclick="fermerModalIndice()">Annuler</button>
                <button class="btn-action btn-valider" onclick="confirmerIndice()">Oui, merci !</button>
            </div>
        </div>
    </div>

        let motActuel = "";
        let lettresMelangees = []; 
        let historiqueReponse = []; 
        let nombreIndices = 0; 
        const avatarImage = document.getElementById('zuzu-avatar');

        function changerHumeurZuzu(humeur) {
            if (imagesZuzu[humeur] && !imagesZuzu[humeur].startsWith("COLLE_TON_CODE")) {
                avatarImage.src = imagesZuzu[humeur];
            } else {
                avatarImage.src = "Calm.png"; 
            }
            
            avatarImage.className = 'avatar-img'; 
            void avatarImage.offsetWidth; 

            if (humeur === 'neutre') {
                avatarImage.classList.add('flotte');
            } else if (humeur === 'joyeux') {
                avatarImage.classList.add('saute');
            } else if (humeur === 'triste') {
                avatarImage.classList.add('tremble');
            }
        }

        
        // --- ACTUALISATION AUTOMATIQUE SI LA PAGE EST RESTÉE OUVERTE ---
        const dateChargementPage = new Date().toDateString();
        document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === "visible") {
                const dateActuelle = new Date().toDateString();
                if (dateChargementPage !== dateActuelle) {
                    window.location.reload(true); // Force le rafraîchissement si on a changé de jour
                }
            }
        });
        // ---------------------------------------------------------------

        function initialiserJeu() {
            motActuel = MOT_A_TROUVER.toUpperCase(); // On s'assure qu'il est en majuscules
            
            // --- ANTI-TRICHE : Récupération de la sauvegarde ---
            const sauvegarde = JSON.parse(localStorage.getItem('zuzu_sauvegarde') || '{}');
            
            // On lie la triche au MOT lui-même, et non plus à la date !
            if (sauvegarde.mot === motActuel) {
                nombreIndices = sauvegarde.indices || 0;
            } else {
                nombreIndices = 0;
                localStorage.setItem('zuzu_sauvegarde', JSON.stringify({ mot: motActuel, indices: 0 }));
            }
            // --------------------------------------------------- 
            
            lettresMelangees = motActuel.split('').map((char, index) => {
                return { id: index, caractere: char, utilise: false };
            });

            for (let i = lettresMelangees.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [lettresMelangees[i], lettresMelangees[j]] = [lettresMelangees[j], lettresMelangees[i]];
            }

            let motRecree = lettresMelangees.map(l => l.caractere).join('');
            if (motRecree === motActuel && motActuel.length > 1) {
                [lettresMelangees[0], lettresMelangees[1]] = [lettresMelangees[1], lettresMelangees[0]];
            }

            historiqueReponse = []; 
            
            // --- ANTI-TRICHE : Replacer les indices déjà demandés ---
            if (nombreIndices > 0) {
                for (let i = 0; i < nombreIndices; i++) {
                    const vraieLettre = motActuel[i];
                    const lettreBazar = lettresMelangees.find(l => l.caractere === vraieLettre && !l.utilise);
                    if (lettreBazar) {
                        lettreBazar.utilise = true;
                        historiqueReponse.push(lettreBazar.id);
                    }
                }
            }
            // --------------------------------------------------------

            document.getElementById('btn-preuve').style.display = 'none';
            document.querySelector('.btn-indice').style.display = 'inline-block';
            document.querySelector('.btn-effacer').style.display = 'inline-block';
            document.querySelector('.btn-valider').style.display = 'inline-block';
            document.getElementById('zone-bazar').style.display = 'flex';
            afficherBazar();
            afficherReponse();
            changerHumeurZuzu('neutre');
        }

        function afficherBazar() {
            const zoneBazar = document.getElementById('zone-bazar');
            zoneBazar.innerHTML = ''; 

            lettresMelangees.forEach(lettre => {
                const btn = document.createElement('button');
                btn.className = 'lettre-btn';
                btn.innerText = lettre.caractere;
                
                if (lettre.utilise) {
                    btn.classList.add('utilisee');
                } else {
                    btn.onclick = () => cliquerLettre(lettre.id);
                }
                
                zoneBazar.appendChild(btn);
            });
        }

        function afficherReponse() {
            const zoneReponse = document.getElementById('zone-reponse');
            zoneReponse.innerHTML = ''; 

            for (let i = 0; i < motActuel.length; i++) {
                const tuile = document.createElement('div');
                tuile.className = 'reponse-tuile';
                
                if (i < historiqueReponse.length) {
                    const lettreId = historiqueReponse[i];
                    const lettreObj = lettresMelangees.find(l => l.id === lettreId);
                    tuile.innerText = lettreObj.caractere;
                    
                    if (i < nombreIndices) {
                        tuile.classList.add('indice-verrouille');
                    }
                }
                
                zoneReponse.appendChild(tuile);
            }
        }

        function cliquerLettre(id) {
            const lettre = lettresMelangees.find(l => l.id === id);
            lettre.utilise = true;
            historiqueReponse.push(id);
            afficherBazar();
            afficherReponse();
            document.getElementById('message').innerText = "";
            changerHumeurZuzu('neutre'); 
        }

        function effacerDerniereLettre() {
            if (historiqueReponse.length <= nombreIndices) return; 
            
            const dernierId = historiqueReponse.pop();
            const lettre = lettresMelangees.find(l => l.id === dernierId);
            lettre.utilise = false;
            
            afficherBazar();
            afficherReponse();
            document.getElementById('message').innerText = "";
            changerHumeurZuzu('neutre');
        }

        // GESTION DE LA FENÊTRE MODALE
        function ouvrirModalIndice() {
            if (nombreIndices >= motActuel.length) return;
            document.getElementById('modal-indice').classList.add('active');
        }

        function fermerModalIndice() {
            document.getElementById('modal-indice').classList.remove('active');
        }

        function confirmerIndice() {
            fermerModalIndice(); // On ferme la petite fenêtre
            
            nombreIndices++; 
            
            // --- ANTI-TRICHE : Sauvegarde ---
            localStorage.setItem('zuzu_sauvegarde', JSON.stringify({ mot: motActuel, indices: nombreIndices }));
            // -------------------------------- 
            
            historiqueReponse = [];
            lettresMelangees.forEach(l => l.utilise = false);
            
            // Trouve et verrouille les lettres des indices
            for (let i = 0; i < nombreIndices; i++) {
                const vraieLettre = motActuel[i];
                const lettreBazar = lettresMelangees.find(l => l.caractere === vraieLettre && !l.utilise);
                if (lettreBazar) {
                    lettreBazar.utilise = true;
                    historiqueReponse.push(lettreBazar.id);
                }
            }
            
            afficherBazar();
            afficherReponse();
            
            const messageBox = document.getElementById('message');
            messageBox.innerText = "Et voilà un petit coup de pouce !";
            messageBox.className = "message"; 
            changerHumeurZuzu('neutre');
        }

        function verifier() {
            const messageBox = document.getElementById('message');
            
            let motSaisi = historiqueReponse.map(id => {
                return lettresMelangees.find(l => l.id === id).caractere;
            }).join('');
            
            if (historiqueReponse.length < motActuel.length) {
                messageBox.innerText = "Il manque des lettres, rooh !";
                messageBox.className = "message error";
                changerHumeurZuzu('triste');
                return;
            }
            
            if (motSaisi === motActuel) {
                messageBox.innerText = "Bravo super Zuzu ! 🎉 C'est le bon mot !";
                messageBox.className = "message success";
                changerHumeurZuzu('joyeux');
                
                // BOUM DES CONFETTIS ! 🎉
                confetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { y: 0.6 },
                    colors: ['#ff7f50', '#f1c40f', '#2ecc71', '#3498db', '#9b59b6']
                });
                
                document.getElementById('btn-preuve').style.display = 'block';
                document.querySelector('.btn-indice').style.display = 'none';
                document.querySelector('.btn-effacer').style.display = 'none';
                document.querySelector('.btn-valider').style.display = 'none';
                document.getElementById('zone-bazar').style.display = 'none';
            } else {
                messageBox.innerText = "Oups, ce n'est pas ça ! On se réveille hop hop";
                messageBox.className = "message error";
                changerHumeurZuzu('triste');
            }
        }

        
        function copierPreuve() {
            const btnPreuve = document.getElementById('btn-preuve');
            const container = document.querySelector('.container');
            
            btnPreuve.innerText = "⏳ Préparation...";
            
            html2canvas(container, {
                backgroundColor: null,
                scale: 2,
                onclone: function(clonedDoc) {
                    const clonedActionsZone = clonedDoc.querySelector('.actions-zone');
                    const clonedBtnPreuve = clonedDoc.getElementById('btn-preuve');
                    const clonedBazarZone = clonedDoc.getElementById('zone-bazar');
                    const clonedConsigne = clonedDoc.querySelector('.consigne');
                    
                    if(clonedActionsZone) clonedActionsZone.style.display = 'none';
                    if(clonedBtnPreuve) clonedBtnPreuve.style.display = 'none';
                    if(clonedBazarZone) clonedBazarZone.style.display = 'none';
                    if(clonedConsigne) clonedConsigne.style.display = 'none';
                }
            }).then(canvas => {
                canvas.toBlob(blob => {
                    if (!blob) return;
                    
                    // Détection du mobile
                    const isMobile = /Android|webOS|iPhone|iPad|iPod/i.test(navigator.userAgent);
                    const file = new File([blob], "victoire.png", { type: "image/png" });
                    
                    const successUI = (text) => {
                        btnPreuve.innerText = text;
                        btnPreuve.style.backgroundColor = "#2ecc71";
                        btnPreuve.style.boxShadow = "0 4px 0 #27ae60";
                        setTimeout(() => {
                            btnPreuve.innerText = isMobile ? "📸 Partager la Preuve" : "📸 Copier la Preuve";
                            btnPreuve.style.backgroundColor = ""; 
                            btnPreuve.style.boxShadow = ""; 
                        }, 4000);
                    };

                    const failUI = () => {
                        btnPreuve.innerText = "📱 Fais une capture d'écran classique !";
                        setTimeout(() => {
                            btnPreuve.innerText = isMobile ? "📸 Partager la Preuve" : "📸 Copier la Preuve";
                        }, 4000);
                    };

                    // OPTION 1 : MOBILE -> On utilise le menu de Partage Natif
                    if (isMobile && navigator.canShare && navigator.canShare({ files: [file] })) {
                        navigator.share({
                            files: [file],
                            title: 'Les pitits devoirs de Zuzu',
                            text: 'J\'ai trouvé le mot du jour !'
                        }).then(() => {
                            successUI("✔️ Partagé !");
                        }).catch(err => {
                            // L'utilisateur a simplement fermé le menu de partage
                            btnPreuve.innerText = "📸 Partager la Preuve"; 
                        });
                    } 
                    // OPTION 2 : PC -> Presse-papier direct
                    else {
                        try {
                            const item = new ClipboardItem({ "image/png": blob });
                            navigator.clipboard.write([item]).then(() => {
                                successUI("✔️ Copié ! Va faire 'Coller' !");
                            }).catch(err => {
                                failUI();
                            });
                        } catch(err) {
                            failUI();
                        }
                    }
                });
            });
        }

        initialiserJeu();
    </script>
</body>
</html>
